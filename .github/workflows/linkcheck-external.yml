name: External link check

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx eleventy --output=_built-site
      - name: Check external links
        id: lychee
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >-
            --no-progress
            --root-dir ${{ github.workspace }}/_built-site
            --scheme https --scheme http
            --exclude 'web\.archive\.org'
            --exclude-path _built-site/BW2006
            --exclude-path _built-site/BW2016
            --exclude-path _built-site/kokoukset
            --exclude-path _built-site/vanhaset
            _built-site
          fail: true
      - name: Open or update issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: peter-evans/create-issue-from-file@v6.0.0
        with:
          title: Broken external links
          content-filepath: ./lychee/out.md
          labels: report, automated issue
